<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deidreich</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <img src="/dragon.png" alt="" class="brand-watermark">
  <div class="hazard-stripe"></div>
  <div class="app">
    <header>
      <img id="emblem" src="/dragon.png" alt="Deidreich emblem" class="brand-emblem">
      <h1>Deidreich</h1>
      <img src="/dragon2.png" alt="" class="brand-emblem">
      <p class="muted">Powered by Google Gemini &middot; speaks its replies aloud</p>
      <button id="voice-btn" class="ghost voice-on" type="button">🔊 Voice on</button>
      <select id="voice-style-select" class="ghost voice-select" title="Choose Deidreich's voice"></select>
      <button id="clear-btn" class="ghost" type="button">Clear chat</button>
    </header>
    <div id="chat" class="chat"></div>
    <div id="error" class="error-text" style="display:none;"></div>
    <div id="attachments" class="attachments" style="display:none;"></div>
    <form id="chat-form" class="composer">
      <input type="file" id="file-input" multiple accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,text/markdown,text/csv,application/json" hidden>
      <button type="button" id="attach-btn" class="icon-btn" title="Attach a file">📎</button>
      <textarea id="input" placeholder="Ask me anything… (Enter to send, Shift+Enter for a new line)" rows="1" required></textarea>
      <button type="button" id="mic-btn" class="icon-btn" title="Speak your message">🎤</button>
      <button type="submit">Send</button>
    </form>
  </div>
  <footer id="site-footer">Deidreich&trade; &mdash; Sanders, 2026</footer>
  <div class="hazard-stripe"></div>
  <script src="/app.js"></script>
</body>
</html>
